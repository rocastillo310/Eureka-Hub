<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Centro Eureka Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concepto: panel operativo de agencia. Barra lateral con cuentas, trabajo organizado por etapa y responsable. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface2:#F5F7F6; --ink:#15211F; --muted:#5B6B68; --line:#D8E0DD;
  --accent:#0E6F66; --accent-ink:#FFFFFF; --accent-soft:#D7EEEA;
  --s-red:#B7791F; --s-dis:#2F6FB5; --s-cli:#7A4FB0; --s-pro:#0E6F66; --s-pub:#3E7D3A;
  --s-red-bg:#FBEFD6; --s-dis-bg:#DEEAF8; --s-cli-bg:#EBE1F6; --s-pro-bg:#D7EEEA; --s-pub-bg:#E0F0DD;
  --bad:#B3261E; --bad-bg:#FBE3E0; --warn:#9A5B00; --warn-bg:#FCEBCB;
  --n-blue-bg:#CFE0F5;--n-blue-fg:#1D3557;--n-purple-bg:#D9D2EE;--n-purple-fg:#2F2552;--n-red-bg:#F3C9C9;--n-red-fg:#5A1E1E;--n-orange-bg:#FBDDB8;--n-orange-fg:#5A3300;--n-green-bg:#CFE8B8;--n-green-fg:#24441A;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#162120; --surface2:#1B2928; --ink:#E6EFED; --muted:#93A5A1; --line:#2A3B39;
  --accent:#3FB5A8; --accent-ink:#06201D; --accent-soft:#17403B;
  --s-red:#E3A94B; --s-dis:#6FA8E6; --s-cli:#B591E0; --s-pro:#3FB5A8; --s-pub:#7CC274;
  --s-red-bg:#3A2D12; --s-dis-bg:#15283F; --s-cli-bg:#2A1F3E; --s-pro-bg:#17403B; --s-pub-bg:#1D3A1B;
  --bad:#F28B82; --bad-bg:#3E1B18; --warn:#F0B35A; --warn-bg:#3A2A0C;
  --n-blue-bg:#24405F;--n-blue-fg:#D6E6FB;--n-purple-bg:#3B3260;--n-purple-fg:#E4DEFA;--n-red-bg:#5E2B2B;--n-red-fg:#FADADA;--n-orange-bg:#5E4018;--n-orange-fg:#FBE6C9;--n-green-bg:#2E4B22;--n-green-fg:#DDF0CB;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --surface2:#1B2928; --ink:#E6EFED; --muted:#93A5A1; --line:#2A3B39;
  --accent:#3FB5A8; --accent-ink:#06201D; --accent-soft:#17403B;
  --s-red:#E3A94B; --s-dis:#6FA8E6; --s-cli:#B591E0; --s-pro:#3FB5A8; --s-pub:#7CC274;
  --s-red-bg:#3A2D12; --s-dis-bg:#15283F; --s-cli-bg:#2A1F3E; --s-pro-bg:#17403B; --s-pub-bg:#1D3A1B;
  --bad:#F28B82; --bad-bg:#3E1B18; --warn:#F0B35A; --warn-bg:#3A2A0C;
  --n-blue-bg:#24405F;--n-blue-fg:#D6E6FB;--n-purple-bg:#3B3260;--n-purple-fg:#E4DEFA;--n-red-bg:#5E2B2B;--n-red-fg:#FADADA;--n-orange-bg:#5E4018;--n-orange-fg:#FBE6C9;--n-green-bg:#2E4B22;--n-green-fg:#DDF0CB;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--accent);color:var(--accent-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-art h1{font-size:clamp(34px,5vw,56px);line-height:1.02}
.login-art p{max-width:42ch;opacity:.92}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow span{border:1px solid currentColor;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.login-form{padding:48px 32px;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;width:100%;margin:0 auto}
.err{color:var(--bad);font-weight:600;min-height:20px}
/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;display:flex;gap:8px;align-items:center}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.row{display:flex;gap:10px;align-items:center;min-width:0}
main{padding:26px clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.head h2{font-size:28px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{font-family:var(--font-display);font-size:28px;display:block;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.st-redaccion,.st-brief{background:var(--s-red-bg);color:var(--s-red)}
.st-diseno{background:var(--s-dis-bg);color:var(--s-dis)}
.st-cliente,.st-revision{background:var(--s-cli-bg);color:var(--s-cli)}
.st-programada{background:var(--s-pro-bg);color:var(--s-pro)}
.st-publicada,.st-entregada{background:var(--s-pub-bg);color:var(--s-pub)}
.risk-atrasada{background:var(--bad-bg);color:var(--bad)}
.risk-riesgo{background:var(--warn-bg);color:var(--warn)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%;align-items:center}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{font-size:15px;display:flex;gap:8px;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(172px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h3{font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;overflow-wrap:anywhere}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:4px;min-width:760px}
.cal .dow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px}
.cal .day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px}
.cal .day.out{opacity:.45}.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .day small{color:var(--muted);font-weight:600}
.chip{border:0;border-radius:6px;padding:2px 6px;font-size:12px;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.stepper{display:flex;flex-wrap:wrap;gap:6px}
.step{flex:1 1 90px;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line);text-align:center}
.step.done{background:var(--accent-soft);color:var(--accent)}
.step.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--bg);width:min(620px,100%);height:100%;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{border-left:2px solid var(--line);padding-left:10px}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:90vw}
.guide{max-width:72ch;display:flex;flex-direction:column;gap:14px}
.guide h3{font-size:18px;margin-top:6px}
.guide p,.guide li{margin:0}
.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.ag{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.agcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.agcal .dow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px;text-align:center}
.agd{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:72px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.agd:hover{border-color:var(--accent)}
.agd.out{background:transparent;border-style:dashed;color:var(--muted)}
.agd.sel{outline:2px solid var(--ink);outline-offset:-2px}
.agd .n{font-weight:700;font-variant-numeric:tabular-nums}
.agd.today .n{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ag-row{padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ag-t{border:0;background:transparent;text-align:left;display:flex;flex-direction:column;padding:0;flex:1;min-width:0}
.done{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.kb{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:start}
.kpal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:22px;align-items:center}
.kpal .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;align-self:flex-start}
.stack{width:54px;height:54px;border:0;border-radius:3px;background:var(--nb);color:var(--nf);font-weight:700;margin:0 12px 12px 0;box-shadow:6px -6px 0 color-mix(in srgb,var(--nb) 60%,var(--surface)),12px -12px 0 color-mix(in srgb,var(--nb) 30%,var(--surface))}
.stack:hover{transform:translateY(-2px)}
.c-blue{--nb:var(--n-blue-bg);--nf:var(--n-blue-fg)}.c-purple{--nb:var(--n-purple-bg);--nf:var(--n-purple-fg)}.c-red{--nb:var(--n-red-bg);--nf:var(--n-red-fg)}.c-orange{--nb:var(--n-orange-bg);--nf:var(--n-orange-fg)}.c-green{--nb:var(--n-green-bg);--nf:var(--n-green-fg)}
.kboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--surface)}
.kcol{border-right:1px solid var(--line);min-height:440px;display:flex;flex-direction:column;min-width:0}
.kcol:last-child{border-right:0}
.kh{padding:10px;text-align:center;font-weight:700;border-bottom:1px solid var(--line);background:var(--hb);color:var(--hf)}
.kh small{font-weight:600;opacity:.8;margin-left:6px}.kh.over{color:var(--bad)}
.kbody{padding:12px;display:flex;flex-direction:column;gap:12px;flex:1}
.kbody.over{background:var(--surface2)}
.note{position:relative;border-radius:3px;padding:10px 12px;box-shadow:2px 3px 0 rgba(0,0,0,.14);cursor:grab;display:flex;flex-direction:column;gap:6px;background:var(--nb);color:var(--nf);min-width:0}
.note.dragging{opacity:.4}
.note .nt{border:0;background:transparent;text-align:left;font-weight:600;padding:0;overflow-wrap:anywhere;padding-right:22px;min-height:24px}
.note .meta{font-size:12px;opacity:.85;overflow-wrap:anywhere}
.note .flag{position:absolute;top:-6px;right:-6px;width:22px;height:22px}
.note .arrows{display:flex;justify-content:space-between;gap:6px}
.note .arrows button{border:0;background:rgba(0,0,0,.08);color:inherit;border-radius:4px;width:28px;height:24px;line-height:1}
.limit{text-align:center;font-size:12px;letter-spacing:.14em;border-top:1px dashed var(--line);padding-top:8px;color:var(--s-cli);font-weight:600}
.limit b{display:block;letter-spacing:0;color:var(--bad);font-weight:600;margin-top:2px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
@media (max-width:820px){.kb{grid-template-columns:1fr}.kpal{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:6px 22px}.kpal .lbl{width:100%}}
@media (max-width:820px){
  .ag{grid-template-columns:1fr}.agd{min-height:54px;padding:4px}
  .login{grid-template-columns:1fr}.login-art{padding:28px 20px}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:15;gap:0;overflow:visible}
  .side .brand,.side .me .who{display:none}.side .me{margin:0;border:0;padding:0;flex:none}
  .nav{flex-direction:row;flex:1;overflow-x:auto}.nav button{flex:1 0 auto;flex-direction:column;font-size:12px;padding:6px 8px;gap:2px;text-align:center}
  main{padding-bottom:90px}.two{grid-template-columns:1fr}.head h2{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
/* ---- v5: estructura tipo Monday / ClickUp ---- */
:root{--f-amber:#F2C14E;--f-blue:#7AB2EC;--f-purple:#BE9BE8;--f-teal:#4FC3B5;--f-green:#86CC7D;--f-red:#EE7F77;--f-gray:#BCC6C3}
.ic{width:16px;height:16px;flex:none}
.lb-amber{background:var(--s-red-bg);color:var(--s-red)}.lb-blue{background:var(--s-dis-bg);color:var(--s-dis)}.lb-purple{background:var(--s-cli-bg);color:var(--s-cli)}.lb-teal{background:var(--s-pro-bg);color:var(--s-pro)}.lb-green{background:var(--s-pub-bg);color:var(--s-pub)}.lb-red{background:var(--bad-bg);color:var(--bad)}.lb-gray{background:var(--surface2);color:var(--muted)}
.sp{display:inline-block;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pr{display:inline-flex;gap:4px;align-items:center;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pr .ic{width:12px;height:12px}
.fill{display:block;width:100%;padding:6px 8px;border-radius:4px;text-align:center;font-weight:600;font-size:13px;color:#15211F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-amber{background:var(--f-amber)}.f-blue{background:var(--f-blue)}.f-purple{background:var(--f-purple)}.f-teal{background:var(--f-teal)}.f-green{background:var(--f-green)}.f-red{background:var(--f-red)}.f-gray{background:var(--f-gray)}.f-none{background:var(--surface2);color:var(--muted)}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:currentColor!important}
.av{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;border:2px solid var(--surface);flex:none}
.avs{display:inline-flex}.avs .av+.av{margin-left:-6px}
.av-empty{background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.navlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 2px;font-weight:700}
.tree{display:flex;flex-direction:column;gap:1px;margin-bottom:2px}
.trow{display:flex;align-items:center}
.moreNav{display:none!important}
.nav .tchev{flex:none;width:24px;height:28px;padding:0;justify-content:center;color:var(--muted);background:transparent}

var CTX_WHY="";
function doAct(a,t,sys){
  var A=acc(t.acc),k=a.act.k,v=a.act.v;
  if(k==="assign_role"){
    var uid=A&&A.team[v];
    if(uid&&!(t.assignees.length===1&&t.assignees[0]===uid)){t.assignees=[uid];logT(t,"Automatización: asignada a "+uname(uid));notify(uid,"Te asignaron «"+t.title+"» ("+shortName(A.name)+")"+(CTX_WHY?" · regresó: "+CTX_WHY:""),t.id,sys)}
  }else if(k==="notify_role"){
    var u2=A&&A.team[v];if(u2){notify(u2,"«"+t.title+"» pasó a «"+sDef(t).n+"»",t.id,sys);logT(t,"Automatización: avisó a "+uname(u2))}
  }else if(k==="notify_assignees"){
    t.assignees.forEach(function(i){notify(i,"«"+t.title+"» vence "+fdate(t.date).toLowerCase(),t.id,sys)});
    if(t.assignees.length)logT(t,"Automatización: avisó a "+names(t.assignees));
  }else if(k==="set_priority"){
    if(t.priority!==v){t.priority=v;logT(t,"Automatización: prioridad «"+prioDef(v).n+"»")}
  }else if(k==="advance"){
    var nx=sts(t)[sIdx(t)+1];
    if(nx){logT(t,"Automatización: pasa a la siguiente etapa");setStatus(t,nx.k,"",true)}
  }
}
function runStatusAutos(t,k){
  S.autos.filter(function(a){return a.on&&a.type===t.type&&a.trig.k==="status"&&a.trig.v===k}).forEach(function(a){doAct(a,t)});
}
function setStatus(t,k,why,auto){
  var oldi=sIdx(t),old=sDef(t),ni=sts(t).findIndex(function(s){return s.k===k});
  if(ni<0||ni===oldi)return;
  t.status=k;
  logT(t,(ni<oldi?"Regresó":"Movió")+" de «"+old.n+"» a «"+sDef(t).n+"»"+(why?": "+why:""));
  var before=t.assignees.join(",");
  CTX_WHY=(ni<oldi&&why)?why:"";
  runStatusAutos(t,k);
  CTX_WHY="";
  if(ni<oldi&&why&&t.assignees.join(",")===before)t.assignees.forEach(function(i){notify(i,"«"+t.title+"» regresó a «"+sDef(t).n+"»: "+why,t.id)});
}
function runDue(){
  var ch=false;
  S.tasks.forEach(function(t){
    if(isFinal(t))return;
    t.fired=t.fired||{};
    S.autos.forEach(function(a){
      if(!a.on||a.type!==t.type||a.trig.k!=="due_soon"||t.fired[a.id])return;
      if(dayDiff(t.date)<=(+a.trig.v||0)){t.fired[a.id]=true;doAct(a,t,true);ch=true}
    });
  });
  if(ch)save();
}

function weekBucket(t){
  var d=dayDiff(t.date);

function applyFilters(arr){
  var q=S.q,u=me(),tx=q.text.trim().toLowerCase();
  return arr.filter(function(t){
    if(q.hideDone&&isFinal(t))return false;
    if(tx&&(t.title+" "+t.tags.join(" ")+" "+names(t.assignees)).toLowerCase().indexOf(tx)<0)return false;
    if(q.who==="yo"&&t.assignees.indexOf(u.id)<0)return false;
    if(q.who==="none"&&t.assignees.length)return false;
    if(q.who&&q.who!=="yo"&&q.who!=="none"&&t.assignees.indexOf(q.who)<0)return false;
    var d=dayDiff(t.date);
    if(q.preset==="atrasadas"&&risk(t)!=="atrasada")return false;
    if(q.preset==="hoy"&&(d!==0||isFinal(t)))return false;
    if(q.preset==="semana"&&(d<0||d>7||isFinal(t)))return false;
    if(q.preset==="urgentes"&&t.priority!=="urgente")return false;
    if(q.preset==="riesgo"&&!risk(t))return false;
    return true;
  }).sort(byDate);

    var no=arr.filter(function(t){return !t.assignees.length});if(no.length)out.push({key:"none",label:'<b>Sin asignar</b>',color:"gray",set:{},tasks:no});
  }else if(g==="prio"){
    PRIO.forEach(function(p){out.push({key:p.k,label:'<span class="sp lb-'+p.c+'">'+esc(p.n)+'</span>',color:p.c,set:{prio:p.k},tasks:arr.filter(function(t){return t.priority===p.k})})});
    out.push({key:"sin",label:'<b>Sin prioridad</b>',color:"gray",set:{},tasks:arr.filter(function(t){return !t.priority})});
  }else{

  }

}

  var h='<div class="head"><div><h2>Panel</h2><div class="muted">Estado general de todas las cuentas</div></div></div>';
  h+='<div class="tiles">'+tile(op.length,"Tareas abiertas")+tile(lt.length,"Atrasadas",lt.length?"bad":"")+tile(rk.length,"En riesgo",rk.length?"warn":"")+tile(sa.length,"Sin asignar")+tile(all.length-op.length,"Terminadas")+'</div>';
  h+='<div class="dash">';
  ["redes","diseno"].forEach(function(ty){
    var ts=all.filter(function(t){return t.type===ty}),mx=Math.max.apply(null,S.stat[ty].map(function(s){return ts.filter(function(t){return t.status===s.k}).length}).concat([1]));
    h+='<div class="panel"><h3 style="font-size:16px;margin-bottom:10px">Tareas por estado · '+TYPES[ty]+'</h3>'+S.stat[ty].map(function(s){return barRow(esc(s.n),ts.filter(function(t){return t.status===s.k}).length,mx,FILLV[s.c])}).join("")+'</div>';
  });
  var load=S.users.map(function(u){return{u:u,n:op.filter(function(t){return t.assignees.indexOf(u.id)>-1}).length}}),mxl=Math.max.apply(null,load.map(function(x){return x.n}).concat([1]));
  h+='<div class="panel"><h3 style="font-size:16px;margin-bottom:10px">Tareas abiertas por persona</h3>'+load.map(function(x){return barRow(esc(x.u.name),x.n,mxl,"var(--accent)")}).join("")+barRow("Sin asignar",sa.length,mxl,"var(--muted)")+'</div>';
  var rows=S.accounts.map(function(a){var ts=all.filter(function(t){return t.acc===a.id}),o=openTasks(ts),nx=o.sort(byDate)[0];return{a:a,o:o.length,l:ts.filter(function(t){return risk(t)==="atrasada"}).length,r:ts.filter(function(t){return risk(t)==="riesgo"}).length,nx:nx}});
  h+='<div class="panel" style="grid-column:1/-1"><h3 style="font-size:16px;margin-bottom:10px">Resumen por cuenta</h3><div class="tw"><table class="tbl"><thead><tr><th>Cuenta</th><th class="num">Abiertas</th><th class="num">Atrasadas</th><th class="num">En riesgo</th><th>Próxima entrega</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td><button class="btn small ghost" data-act="space" data-id="'+r.a.id+'">'+accDot(r.a)+' '+esc(shortName(r.a.name))+'</button></td><td class="num tnum">'+r.o+'</td><td class="num tnum">'+(r.l?'<b style="color:var(--bad)">'+r.l+'</b>':0)+'</td><td class="num tnum">'+r.r+'</td><td>'+(r.nx?'<button class="btn small ghost" data-act="open" data-id="'+r.nx.id+'">'+esc(r.nx.title)+'</button> <span class="muted small">'+fshort(r.nx.date)+'</span>':'<span class="muted">—</span>')+'</td></tr>'}).join("")+'</tbody></table></div></div>';
  return h+'</div>';
}


/* ---------- Vista de lista (barra, vistas, filtros) ---------- */
function vList(){
  var sc=scope(),u=me(),h="";
  var all=sc.tasks,ts=applyFilters(all);
  h+='<div class="head"><div><div class="muted small crumb">'+(sc.all?'<button class="btn small ghost" data-act="nav" data-v="spaces">Cuentas</button>':'<button class="btn small ghost" data-act="nav" data-v="spaces">Cuentas</button> / <button class="btn small ghost" data-act="space" data-id="'+sc.space.id+'">'+esc(shortName(sc.space.name))+'</button>')+'</div><h2>'+esc(sc.title)+'</h2></div><div class="actions">'+'<button class="btn dots3" data-act="listopts" aria-label="Vista y opciones de la lista" title="Vista y opciones">⋯</button>'+'<button class="btn primary" data-act="newtask">+ Tarea</button></div></div>';
  if(S.vw!=="form"&&S.vw!=="carga"){
    h+='<div class="toolbar"><div class="field tsearch"><label for="qtext" class="sr">Buscar</label><input id="qtext" data-f="qtext" type="search" placeholder="Buscar por título, etiqueta o persona" value="'+esc(S.q.text)+'"></div>'+
    '<div class="field"><label for="qwho" class="sr">Persona</label><select id="qwho" data-f="qwho"><option value="">Todas las personas</option><option value="yo"'+(S.q.who==="yo"?" selected":"")+'>Solo yo</option><option value="none"'+(S.q.who==="none"?" selected":"")+'>Sin asignar</option>'+S.users.map(function(x){return '<option value="'+x.id+'"'+(S.q.who===x.id?" selected":"")+'>'+esc(x.name)+'</option>'}).join("")+'</select></div>'+
    ((S.vw==="lista"||S.vw==="tabla")?'<div class="field"><label for="qgroup" class="sr">Agrupar</label><select id="qgroup" data-f="qgroup">'+GROUPS.map(function(g){return '<option value="'+g[0]+'"'+(S.q.group===g[0]?" selected":"")+'>Agrupar: '+g[1]+'</option>'}).join("")+'</select></div>':"")+
    '<label class="chk small"><input type="checkbox" data-act="morecols"'+(S.moreCols?" checked":"")+'> Mostrar más columnas</label><label class="chk small"><input type="checkbox" data-act="hidedone"'+(S.q.hideDone?" checked":"")+'> Ocultar terminadas</label></div>';
    h+='<div class="chips">'+[["","Todas"],["atrasadas","Atrasadas"],["riesgo","En riesgo"],["hoy","Para hoy"],["semana","Próx. 7 días"],["urgentes","Urgentes"]].map(function(c){return '<button class="fchip'+(S.q.preset===c[0]?" on":"")+'" data-act="preset" data-v="'+c[0]+'">'+c[1]+'</button>'}).join("")+(ts.length!==all.length?'<span class="muted small">'+ts.length+' de '+all.length+'</span>':"")+'</div>';
  }
  if(S.vw==="lista")h+=vGroups(sc,ts,"lista");
  else if(S.vw==="tabla")h+=vGroups(sc,ts,"tabla");
  else if(S.vw==="tablero")h+=vTablero(sc,ts);
  else if(S.vw==="calendario")h+=vCalTasks(ts);
  else if(S.vw==="carga")h+=vCarga(sc);
  else h+=vForm(sc);
  return h;
}

function stCell(t,skin){var d=sDef(t);return '<button class="cellbtn" data-act="pop" data-p="st" data-id="'+t.id+'" aria-label="Cambiar estado">'+(skin==="tabla"?'<span class="fill f-'+d.c+'">'+esc(d.n)+'</span>':'<span class="sp lb-'+d.c+'">'+esc(d.n)+'</span>')+'</button>'}
function prCell(t,skin){var p=prioDef(t.priority);return '<button class="cellbtn" data-act="pop" data-p="pr" data-id="'+t.id+'" aria-label="Cambiar prioridad">'+(p?(skin==="tabla"?'<span class="fill f-'+p.c+'">'+esc(p.n)+'</span>':'<span class="pr lb-'+p.c+'">'+ic("flag")+esc(p.n)+'</span>'):'<span class="muted small">'+(skin==="tabla"?'<span class="fill f-none">—</span>':"—")+'</span>')+'</button>'}
function dateCell(t){var r=risk(t);return '<input type="date" min="2020-01-01" max="2100-12-31" class="dinp'+(r==="atrasada"?" late":r==="riesgo"?" soon":"")+'" value="'+t.date+'" data-f="tdate" data-id="'+t.id+'" aria-label="Fecha de '+esc(t.title)+'">'}

  var ex=S.exp[t.id],nS=t.subs.length,dn=t.subs.filter(function(s){return s.done}).length,d=sDef(t);

   '<div class="c c-title">'+(skin==="lista"?'<span class="sdot lb-'+d.c+'"></span>':"")+(nS?'<button class="exb'+(ex?" open":"")+'" data-act="exp" data-id="'+t.id+'" aria-expanded="'+(ex?"true":"false")+'" aria-label="Subtareas de '+esc(t.title)+'">'+ic("chev")+'</button>':'<span class="exb sp0"></span>')+

   '<div class="c c-who">'+whoCell(t)+'</div><div class="c c-st">'+stCell(t,skin)+'</div><div class="c c-date">'+dateCell(t)+'</div><div class="c c-pr">'+prCell(t,skin)+'</div><div class="c c-fmt"><span class="muted small">'+esc(t.fmt)+'</span></div></div>';
  if(ex)t.subs.forEach(function(s){h+='<div class="tr sub'+(s.done?" fin":"")+'"><div class="c c-title"><span class="exb sp0"></span><input type="checkbox" data-act="subtog" data-id="'+t.id+'" data-sid="'+s.id+'"'+(s.done?" checked":"")+' aria-label="Subtarea: '+esc(s.title)+'"><span class="'+(s.done?"done":"")+'">'+esc(s.title)+'</span></div>'+(sc.all?'<div class="c c-acc"></div>':"")+'<div class="c c-who">'+(s.assignee?av(s.assignee):"")+'</div><div class="c c-st"></div><div class="c c-date"></div><div class="c c-pr"></div><div class="c c-fmt"></div></div>'});
  return h;

function vGroups(sc,ts,skin){
  var gs=groupTasks(ts,sc.type),colsCls=sc.all?" wacc":"";
  var head='<div class="tr th" aria-hidden="true"><div class="c c-title">Tarea</div>'+(sc.all?'<div class="c c-acc">Cuenta</div>':"")+'<div class="c c-who" title="Quién la tiene que hacer. Toca el círculo para cambiarlo.">Persona</div><div class="c c-st" title="En qué etapa va. Toca la etiqueta de color para cambiarla.">Estado</div><div class="c c-date" title="Fecha límite o de publicación.">Fecha</div><div class="c c-pr" title="Qué tan urgente es.">Prioridad</div><div class="c c-fmt" title="Tipo de pieza: carrusel, reel, post…">Formato</div></div>';
  var h='<div class="tgrid sk-'+skin+colsCls+(S.moreCols?" more":"")+'" role="table">';

    var key=sc.type+S.listId+S.q.group+g.key,cl=S.col[key]===undefined?!!(g.final&&g.tasks.length):S.col[key];

    if(!cl){
      h+=head;
      h+=g.tasks.length?g.tasks.map(function(t){return taskRow(t,sc,skin)}).join(""):'<div class="tr emptyrow"><div class="c c-title muted small">Sin tareas en este grupo.</div></div>';
      if(!sc.all&&S.q.group!=="semana")h+='<form class="tr qa" data-qa="'+esc(g.key)+'" id="qa-'+esc(g.key)+'"><div class="c c-title">'+ic("plus")+'<input aria-label="Agregar tarea" placeholder="Agregar tarea y presionar Enter" id="qai-'+esc(g.key)+'" autocomplete="off"></div></form>';
      if(skin==="tabla"&&g.tasks.length){

        h+='<div class="tr sum"><div class="c c-title muted small">Resumen de estados</div><div class="c sumbar" style="grid-column:2/-1"><span class="sb" role="img" aria-label="Distribución de estados">'+st.map(function(s){var n=g.tasks.filter(function(t){return t.status===s.k}).length;return n?'<i style="width:'+(n/tot*100)+'%;background:'+FILLV[s.c]+'" title="'+esc(s.n)+': '+n+'"></i>':""}).join("")+'</span></div></div>';
      }

/* ---------- Calendario de tareas ---------- */
function vCalTasks(ts){
  var y=+S.calMonth.slice(0,4),m=+S.calMonth.slice(5,7)-1,first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  var cells=[];for(var i=0;i<lead;i++)cells.push(null);for(var d=1;d<=days;d++)cells.push(d);while(cells.length%7)cells.push(null);
  var today=iso(0);
  var h='<div class="row" style="justify-content:space-between"><button class="btn" data-act="cmonth" data-v="-1">Anterior</button><h3 style="text-transform:capitalize">'+first.toLocaleDateString("es-MX",{month:"long",year:"numeric"})+'</h3><button class="btn" data-act="cmonth" data-v="1">Siguiente</button></div><div class="cal-wrap"><div class="cal">'+["lun","mar","mié","jue","vie","sáb","dom"].map(function(x){return '<div class="dow">'+x+'</div>'}).join("");
  cells.forEach(function(d){
    if(!d){h+='<div class="day out"></div>';return}
    var ds=S.calMonth+"-"+String(d).padStart(2,"0"),list=ts.filter(function(t){return t.date===ds});
    h+='<div class="day'+(ds===today?" today":"")+'"><small>'+d+'</small>'+list.map(function(t){return '<button class="chip lb-'+sDef(t).c+'" data-act="open" data-id="'+t.id+'" title="'+esc(t.title+" · "+sDef(t).n)+'">'+esc(t.title)+'</button>'}).join("")+'</div>';
  });
  return h+'</div></div><div class="legend" style="margin-top:8px">'+S.stat[ts.length?ts[0].type:"redes"].map(function(s){return '<span><i class="dot" style="background:'+FILLV[s.c]+'"></i>'+esc(s.n)+'</span>'}).join("")+'</div>';
}

/* ---------- Carga de trabajo ---------- */
function vCarga(sc){
  var op=openTasks(sc.tasks),wk=[];
  var rows=S.users.map(function(u){
    var mine=op.filter(function(t){return t.assignees.indexOf(u.id)>-1});
    return{u:u,n:mine.length,late:mine.filter(function(t){return dayDiff(t.date)<0}).length,week:mine.filter(function(t){var d=dayDiff(t.date);return d>=0&&d<=7}).length,cap:+u.cap||6};
  });
  var none=op.filter(function(t){return !t.assignees.length}).length;
  var mx=Math.max.apply(null,rows.map(function(r){return Math.max(r.n,r.cap)}).concat([none,1]));
  var h='<div class="panel"><h3 style="font-size:16px">Carga de trabajo · '+esc(sc.title)+'</h3><p class="muted small" style="margin:4px 0 12px">Tareas abiertas por persona contra su capacidad. La marca vertical es la capacidad que definió Dirección en Equipo. Se calcula contando tareas abiertas, sin estimar horas.</p>';
  rows.forEach(function(r){
    var over=r.n>r.cap,pct=r.n/mx*100,cp=r.cap/mx*100;
    h+='<div class="wrow"><span class="wn">'+av(r.u.id)+' '+esc(r.u.name)+'</span><span class="wbar" role="img" aria-label="'+esc(r.u.name)+': '+r.n+' de '+r.cap+'"><i class="'+(over?"over":"")+'" style="width:'+pct+'%"></i><b class="wcap" style="left:'+cp+'%" title="Capacidad: '+r.cap+'"></b></span><span class="wv tnum">'+r.n+' / '+r.cap+(over?' <b class="bad">sobrecargado</b>':"")+'<small class="muted"> · '+r.week+' en 7 días'+(r.late?' · <b class="bad">'+r.late+' atrasada'+(r.late>1?"s":"")+'</b>':"")+'</small></span></div>';
  });
  h+='<div class="wrow"><span class="wn"><span class="av av-empty">–</span> Sin asignar</span><span class="wbar"><i style="width:'+(none/mx*100)+'%;background:var(--muted)"></i></span><span class="wv tnum">'+none+'</span></div></div>';
  return h;
}

/* ---------- Formulario de solicitudes ---------- */

  '<div class="field"><label for="rq-list">Lista</label><select id="rq-list">'+Ls.map(function(l){return '<option value="'+l.id+'">'+esc(shortName(acc(l.acc).name)+' · '+l.name)+'</option>'}).join("")+'</select></div>'+
  '<div class="field"><label for="rq-title">¿Qué se necesita?</label><input id="rq-title" required></div><div class="two"><div class="field"><label for="rq-fmt">Formato</label><select id="rq-fmt">'+FORMATS[sc.type].map(function(f){return '<option>'+f+'</option>'}).join("")+'</select></div><div class="field"><label for="rq-date">Fecha límite</label><input id="rq-date" type="date" required value="'+iso(7)+'"></div></div>'+

  '<div class="panel"><h3 style="font-size:16px;margin-bottom:8px">Solicitudes recientes</h3>'+(recent.length?'<div class="list">'+recent.map(taskLine).join("")+'</div>':'<div class="muted small" style="font-style:italic">Aún no hay solicitudes por este formulario.</div>')+'</div></div>';

var DRIVE_SERVER="Google Drive",MCP=null;
function dType(m){m=m||"";if(m==="application/vnd.google-apps.folder")return"Carpeta";if(/shortcut/.test(m))return"Atajo";if(/document|msword|wordprocessing/.test(m))return"Documento";if(/spreadsheet|excel/.test(m))return"Hoja de cálculo";if(/presentation|powerpoint/.test(m))return"Presentación";if(/pdf/.test(m))return"PDF";if(/^image/.test(m))return"Imagen";if(/^video/.test(m))return"Video";return"Archivo"}
function safeUrl(u){return /^https:\/\/(drive|docs)\.google\.com\//.test(u||"")?u:""}
function driveLoad(more){
  if(!MCP)return;
  var cur=S.dr.stack[S.dr.stack.length-1];
  var q="parentId = '"+cur.id+"'"+(S.dr.q?" and title contains '"+S.dr.q.replace(/\\/g,"\\\\").replace(/'/g,"\\'")+"'":"");
  var inp={query:q,pageSize:50,excludeContentSnippets:true};if(more&&S.dr.token)inp.pageToken=S.dr.token;
  S.dr.loading=true;S.dr.err="";render();
  MCP.callTool(DRIVE_SERVER,"search_files",inp).then(function(r){
    var p=r&&r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}
    var f=(p&&p.files)||[];S.dr.items=more&&S.dr.items?S.dr.items.concat(f):f;S.dr.token=(p&&p.nextPageToken)||"";S.dr.loading=false;render();
  }).catch(function(e){S.dr.loading=false;S.dr.err=(e&&e.code)||"upstream_error";render()});
}

  return h;
}

function vGuia(){

  '<h3>Cómo fluye el trabajo</h3><p>Cada mes empieza con el calendario de contenidos de una cuenta (sección Calendarios). Se aprueba con el equipo y luego con el cliente. Al aprobarse se crean las tareas en la lista de redes y entran en «Redacción».</p>'+
  '<h3>Estados y automatizaciones</h3><p>Cambia el estado con un clic sobre la etiqueta de color. Cuando una tarea cambia de estado, las automatizaciones la asignan a la persona del rol correspondiente en esa cuenta y le llega un aviso a su Bandeja. Dirección puede ver, pausar y crear reglas en Automatizaciones, y renombrar o recolorear los estados con el botón Estados de cada lista.</p>'+
  '<h3>Vistas de una lista</h3><p>Cada lista se abre en <b>Tablero</b>: tarjetas por etapa. Con el botón <b>⋯</b> de arriba a la derecha eliges otra vista; se recuerda en tu cuenta y no cambia la de nadie más.</p><ul><li><b>Lista:</b> agrupada por estado, responsable, prioridad o fecha. Edita estado, personas, fecha y prioridad sin abrir la tarea.</li><li><b>Tabla:</b> las mismas columnas con celdas de color y resumen por grupo.</li><li><b>Tablero:</b> arrastra tarjetas entre estados.</li><li><b>Calendario:</b> las tareas por fecha.</li><li><b>Carga de trabajo:</b> cuántas tareas abiertas tiene cada persona frente a su capacidad.</li><li><b>Formulario:</b> para pedir trabajo nuevo con los datos necesarios.</li></ul>'+

  '<h3>Alertas</h3><ul><li><b>En riesgo:</b> faltan 2 días o menos y la tarea aún no está en una etapa final o programada.</li><li><b>Atrasada:</b> pasó la fecha y no está terminada.</li></ul>'+
  '<h3>Bandeja, Mi día y Panel</h3><p>Bandeja junta los avisos. Mi día muestra tus tareas por urgencia. Panel resume todas las cuentas.</p>'+
  '<h3>Pizarra Kanban y Agenda</h3><p>La pizarra son notas libres con columnas y límites; una nota se puede convertir en tarea. La Agenda junta actividades, tareas personales y las fechas de entrega de tus tareas. En su pestaña «Publicaciones» ves solo lo que se publica cada día en redes, de todas las cuentas o de una.</p>'+

function pubEntries(accId){

function shrinkImage(file,cb){
  try{
    var rd=new FileReader();
    rd.onerror=function(){cb(null)};
    rd.onload=function(){
      var im=new Image();
      im.onerror=function(){cb(null)};
      im.onload=function(){
        var mx=640,sc=Math.min(1,mx/Math.max(im.width,im.height)),cv=document.createElement("canvas");
        cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
        var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
        try{cb(cv.toDataURL("image/jpeg",0.75))}catch(e){cb(null)}
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }catch(e){cb(null)}
}

/* ---------- Modo servidor (piloto) ----------
   Si existe /api (Cloudflare Pages Functions + D1), la pantalla sincroniza con el servidor: cada elemento (tarea,
   comentario de aviso, nota…) es una fila, y solo se mandan los elementos que cambiaron. Si no existe (archivo suelto,
   artifact), todo sigue en localStorage como antes. Ver DISENO-FASE-1.md. */
var BASEO={},BASEJ={},CREADO={},ORDEN={},enCurso=false,pendiente=false,fallos=0,TIPOS_ARR={user:"users",account:"accounts",list:"lists",task:"tasks",cal:"cals",ag:"agenda",auto:"autos",inbox:"inbox"};

/* ids únicos aunque dos personas creen algo al mismo tiempo (antes era un contador compartido) */
function nid(){return SRV?Date.now().toString(36)+Math.random().toString(36).slice(2,7):++S.seq}

function cab(){
  var h={"content-type":"application/json"};
  if(SRV&&SRV.dev){try{var u=sessionStorage.getItem(KEY+"-u");if(u)h["X-Dev-User"]=u}catch(e){}}
  return h;
}
function api(ruta,cuerpo){
  return fetch("/api/"+ruta,{method:cuerpo===undefined?"GET":"POST",headers:cab(),body:cuerpo===undefined?undefined:JSON.stringify(cuerpo),cache:"no-store"}).then(function(r){
    return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){var e=new Error(j.error||("Error "+r.status));e.estado=r.status;e.datos=j;throw e}
      return j;
    });
  });
}

/* ---------- estado de la pantalla <-> elementos del servidor ---------- */
function aplanar(){
  var m={};
  function p(tipo,id,datos){m[tipo+"|"+id]={tipo:tipo,id:String(id),datos:datos}}
  S.users.forEach(function(u){var d=cl(u);delete d.pass;p("user",u.id,d)});
  [["account","accounts"],["list","lists"],["task","tasks"],["cal","cals"],["ag","agenda"],["auto","autos"],["inbox","inbox"]].forEach(function(t){S[t[1]].forEach(function(x){p(t[0],x.id,x)})});
  S.kanban.notes.forEach(function(n,i){var d=cl(n);d.o=i;p("note",n.id,d)});
  p("cols","main",{cols:S.kanban.cols});
  Object.keys(S.stat).forEach(function(k){p("stat",k,{v:S.stat[k]})});
  Object.keys(S.seen||{}).forEach(function(k){p("seen",k,{v:S.seen[k]})});
  Object.keys(S.prefs||{}).forEach(function(k){p("pref",k,S.prefs[k])});
  Object.keys(S.boards||{}).forEach(function(k){p("board",k,S.boards[k])});
  return m;
}
function buscar(tipo,id){
  var a=TIPOS_ARR[tipo];
  if(a)return S[a].find(function(x){return x.id===id});
  if(tipo==="note")return S.kanban.notes.find(function(x){return x.id===id});
  return undefined;
}
function localComo(tipo,id){
  var o=buscar(tipo,id);
  if(o)return cl(o);
  if(tipo==="cols")return{cols:cl(S.kanban.cols)};
  if(tipo==="stat")return S.stat[id]?{v:cl(S.stat[id])}:undefined;
  if(tipo==="seen")return S.seen[id]!==undefined?{v:S.seen[id]}:undefined;
  if(tipo==="pref")return S.prefs[id]?cl(S.prefs[id]):undefined;
  if(tipo==="board")return S.boards[id]?cl(S.boards[id]):undefined;
  return undefined;
}
function poner(tipo,id,d){
  var a=TIPOS_ARR[tipo];
  if(a){var i=S[a].findIndex(function(x){return x.id===id});if(i>=0)S[a][i]=d;else S[a].push(d);return}
  if(tipo==="note"){ORDEN[id]=d.o;delete d.o;var j=S.kanban.notes.findIndex(function(x){return x.id===id});if(j>=0)S.kanban.notes[j]=d;else S.kanban.notes.push(d);return}
  if(tipo==="cols")S.kanban.cols=d.cols;
  else if(tipo==="stat")S.stat[id]=d.v;
  else if(tipo==="seen")S.seen[id]=d.v;
  else if(tipo==="pref")S.prefs[id]=d;
  else if(tipo==="board")S.boards[id]=d;
}
function quitar(tipo,id){
  var a=TIPOS_ARR[tipo];
  if(a){S[a]=S[a].filter(function(x){return x.id!==id});return}
  if(tipo==="note"){S.kanban.notes=S.kanban.notes.filter(function(x){return x.id!==id});return}
  if(tipo==="seen")delete S.seen[id];
  else if(tipo==="pref")delete S.prefs[id];
  else if(tipo==="board")delete S.boards[id];
}
function ordenar(){
  function porCreado(tipo){return function(a,b){var x=CREADO[tipo+"|"+a.id],y=CREADO[tipo+"|"+b.id];return(x===undefined?1e15:x)-(y===undefined?1e15:y)}}
  Object.keys(TIPOS_ARR).forEach(function(t){var a=TIPOS_ARR[t];S[a]=S[a].map(function(x,i){return[x,i]}).sort(function(p,q){return porCreado(t)(p[0],q[0])||p[1]-q[1]}).map(function(p){return p[0]})});
  S.kanban.notes=S.kanban.notes.map(function(x,i){return[x,i]}).sort(function(p,q){var a=ORDEN[p[0].id],b=ORDEN[q[0].id];return((a===undefined?1e9:a)-(b===undefined?1e9:b))||porCreado("note")(p[0],q[0])||p[1]-q[1]}).map(function(p){return p[0]});
}
function acordar(e){ // deja lo que dijo el servidor como «último acuerdo» de ese elemento
  var k=e.tipo+"|"+e.id;
  BASEO[k]=cl(e.datos);BASEJ[k]=sj(e.datos);CREADO[k]=e.creado;
}
function aplicar(e,instantanea,enviados){
  var k=e.tipo+"|"+e.id;
  if(e.borrado||e.datos===null){delete BASEO[k];delete BASEJ[k];delete CREADO[k];quitar(e.tipo,e.id);return}
  var actual=localComo(e.tipo,e.id),conocido=enviados&&(k in enviados)?enviados[k]:BASEJ[k];
  var editadoEnVuelo=instantanea&&actual!==undefined&&conocido!==undefined&&sj(actual)!==conocido;
  acordar(e);
  if(editadoEnVuelo){ // la persona siguió editando mientras viajaba la solicitud: se conservan sus cambios sobre lo del servidor
    poner(e.tipo,e.id,merge3(instantanea[k]?instantanea[k].datos:null,actual,e.datos));
  }else poner(e.tipo,e.id,cl(e.datos));
}

function construir(entidades){
  S={users:[],accounts:[],lists:[],tasks:[],cals:[],agenda:[],kanban:{cols:[],notes:[]},autos:[],stat:cl(STAT0),inbox:[],seen:{},prefs:{},boards:{},seq:0,session:null};
  BASEO={};BASEJ={};CREADO={};ORDEN={};
  entidades.forEach(function(e){aplicar(e)});
  ordenar();ui();
  if(SRV.dev){try{var u=sessionStorage.getItem(KEY+"-u");if(u&&S.users.some(function(x){return x.id===u}))S.session=u}catch(e){}}
  else if(SRV.yo&&S.users.some(function(x){return x.id===SRV.yo}))S.session=SRV.yo;
  applyPref();
}

/* ---------- sincronizar ---------- */
function programarSync(){
  var b=S.boards||{},k;
  for(k in b){if(JSON.stringify(b[k]).length>1400000)return false}
  clearTimeout(programarSync.t);programarSync.t=setTimeout(sincronizar,150);
  return true;
}
function avisoRed(on,texto){
  var e=document.getElementById("sinconexion");
  if(!on){if(e&&e.parentNode)e.parentNode.removeChild(e);return}
  if(!e){e=document.createElement("div");e.id="sinconexion";e.className="toast";e.setAttribute("role","status");document.body.appendChild(e)}
  e.textContent=texto;
}
function sincronizar(){
  if(!SRV||!S)return Promise.resolve();
  if(SRV.dev&&!S.session)return Promise.resolve();
  if(enCurso){pendiente=true;return Promise.resolve()}
  enCurso=true;
  var act=aplanar(),cambios=[],enviados={};
  Object.keys(act).forEach(function(k){var j=sj(act[k].datos);if(BASEJ[k]!==j){cambios.push({tipo:act[k].tipo,id:act[k].id,base:BASEO[k]||null,datos:act[k].datos});enviados[k]=j}});
  Object.keys(BASEJ).forEach(function(k){if(!act[k]){var i=k.indexOf("|");cambios.push({tipo:k.slice(0,i),id:k.slice(i+1),base:BASEO[k]||null,datos:null});enviados[k]=null}});
  return api("sync",{desde:SRV.cursor,cambios:cambios}).then(function(r){
    var antes=cambios.length;
    (r.entidades||[]).forEach(function(e){aplicar(e,act,enviados)});
    ordenar();
    SRV.cursor=r.cursor;fallos=0;avisoRed(false);
    if(r.aviso)toast(r.aviso); // p. ej., la persona se guardó pero Cloudflare Access no se actualizó
    if(r.entidades&&r.entidades.length)render();
    enCurso=false;
    if(r.mas)return sincronizar();
    if(pendiente){pendiente=false;return sincronizar()}
  }).catch(function(e){
    enCurso=false;
    if(e.estado===401){avisoRed(true,"Tu sesión terminó. Recarga la página para entrar de nuevo.");return}
    fallos++;avisoRed(true,"Sin conexión con el servidor: tus cambios se guardan en cuanto vuelva.");
  });
}
function iniciarSync(){
  setInterval(function(){if(!document.hidden)sincronizar()},15000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)sincronizar()});
  window.addEventListener("online",function(){sincronizar()});
}

function cargarDelServidor(){
  return api("bootstrap").then(function(b){
    if(!b.vacio)return b;
    // base de datos vacía (solo en desarrollo; en producción el servidor nunca dice vacio): se carga la configuración inicial
    S=seed();S.prefs={};
    var act=aplanar();
    return api("seed",{entidades:Object.keys(act).map(function(k){return act[k]})}).catch(function(e){if(e.estado!==409)throw e}).then(function(){return api("bootstrap")});
  }).then(function(b){
    construir(b.entidades);SRV.cursor=b.cursor;
    iniciarSync();
    if(b.mas)return sincronizar();
  });
}
function iniciar(){
  function local(){SRV=null;load();if(S.session)runDue();render()}
  if(location.protocol==="file:"||typeof fetch!=="function")return local();
  var app=document.getElementById("app");if(app)app.textContent="Cargando…";
  fetch("/api/yo",{headers:{"content-type":"application/json"},cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("sin servidor");return r.json()}).then(function(y){
    if(!y||typeof y.dev!=="boolean")throw new Error("no es el servidor");
    SRV={dev:y.dev,yo:y.yo||null,aviso:y.aviso||null,cursor:0};
    return cargarDelServidor().then(function(){if(S.session)runDue();render()});
  }).catch(function(e){if(SRV){if(app)app.textContent="No se pudo entrar: "+(e&&e.message||"error del servidor");return}local()});
}
/* Mezcla de cambios de tres vías. La usan el servidor (functions/_merge3.js, generado) y la pantalla (08-servidor).
   Solo declaraciones de funciones: build.py la incluye dentro de la IIFE de la pantalla y la exporta para el servidor.

   merge3(base, local, remoto): base = lo último que la persona recibió del servidor, local = lo que ella tiene ahora,
   remoto = lo que el servidor tiene ahora. Devuelve el resultado de aplicar los cambios de la persona sobre lo remoto:
   - campo que la persona no tocó: se queda lo remoto
   - campo de texto/número/etc. que sí tocó: gana lo de la persona (último en guardar, pero solo en ese campo)
   - lista (comentarios, historial, subtareas, personas…): se suman los elementos nuevos y se quitan solo los que la
     persona quitó, sin tocar lo que otras personas agregaron
   - objeto: se mezcla clave por clave */
function sj(x){
  if(x===null||typeof x!=="object")return JSON.stringify(x===undefined?null:x);
  if(Array.isArray(x))return "["+x.map(sj).join(",")+"]";
  return "{"+Object.keys(x).sort().map(function(k){return JSON.stringify(k)+":"+sj(x[k])}).join(",")+"}";
}
function cl(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x))}
function esObj(x){return x!==null&&typeof x==="object"&&!Array.isArray(x)}
function claveItem(it){return esObj(it)&&it.id!==undefined?"i:"+it.id:"j:"+sj(it)}
function mezclaLista(base,local,remoto){
  var kb={},kl={};
  base.forEach(function(x){kb[claveItem(x)]=x});
  local.forEach(function(x){kl[claveItem(x)]=x});
  var quitados={},cambiados={},nuevos=[];
  Object.keys(kb).forEach(function(k){if(!(k in kl))quitados[k]=1});
  local.forEach(function(x){var k=claveItem(x);if(!(k in kb))nuevos.push(x);else if(sj(kb[k])!==sj(x))cambiados[k]=x});
  var sal=[],vistos={};
  remoto.forEach(function(x){
    var k=claveItem(x);
    if(quitados[k])return;
    sal.push(k in cambiados?cl(cambiados[k]):cl(x));vistos[k]=1;
  });
  nuevos.forEach(function(x){var k=claveItem(x);if(!vistos[k]){sal.push(cl(x));vistos[k]=1}});
  return sal;
}
function merge3(base,local,remoto){
  base=base||{};remoto=remoto||{};
  var sal=cl(remoto);
  Object.keys(local).forEach(function(k){
    var b=base[k],l=local[k],r=remoto[k];
    if(sj(b)===sj(l))return;
    if(Array.isArray(l)&&(Array.isArray(r)||r===undefined)&&(Array.isArray(b)||b===undefined))sal[k]=mezclaLista(b||[],l,r||[]);
    else if(esObj(l)&&(esObj(r)||r===undefined)&&(esObj(b)||b===undefined))sal[k]=merge3(b,l,r);
    else sal[k]=cl(l);
  });
  Object.keys(base).forEach(function(k){if(!(k in local))delete sal[k]});
  return sal;
}
iniciar();

})();
